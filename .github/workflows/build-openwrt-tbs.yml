name: Build OpenWrt 22.03 with TBS DVB Drivers

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses5-dev gawk git subversion gettext libssl-dev zlib1g-dev file unzip python3 python3-distutils ccache

      - name: Clone OpenWrt source
        run: git clone -b openwrt-22.03 --depth 1 https://github.com/openwrt/openwrt.git openwrt

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 手动集成 TBS 驱动源码（不使用 feed，避免认证问题）
      - name: Add TBS driver source manually
        run: |
          cd openwrt/package/kernel
          mkdir -p tbs-driver/src
          cd tbs-driver/src
          git clone --depth 1 https://github.com/tbsdtv/linux_media.git .
          cd ..
          cat > Makefile << 'EOF'
include $(TOPDIR)/rules.mk

PKG_NAME:=tbs-driver
PKG_VERSION:=20240301
PKG_RELEASE:=1
PKG_SOURCE_PROTO:=git
PKG_SOURCE_URL:=https://github.com/tbsdtv/linux_media.git
PKG_SOURCE_VERSION:=master
PKG_SOURCE_LOCAL:=1

include $(INCLUDE_DIR)/package.mk
include $(INCLUDE_DIR)/kernel.mk

define Build/Prepare
	mkdir -p $(PKG_BUILD_DIR)
	cp -r ./src/* $(PKG_BUILD_DIR)/
endef

define KernelPackage/tbs-driver
  SUBMENU:=Video Support
  TITLE:=TBS DVB drivers
  DEPENDS:=+kmod-i2c-core +kmod-i2c-algo-bit
  FILES:=$(PKG_BUILD_DIR)/drivers/media/**/*.ko
  AUTOLOAD:=$(call AutoProbe, $(AUTOLOAD_MODS))
endef

define Build/Compile
	$(MAKE) -C "$(LINUX_DIR)" \
		ARCH="$(LINUX_KARCH)" \
		CROSS_COMPILE="$(TARGET_CROSS)" \
		M="$(PKG_BUILD_DIR)/drivers/media" \
		modules
endef

$(eval $(call KernelPackage,tbs-driver))
EOF

      - name: Enable DVB kernel support
        run: |
          cd openwrt
          KERNEL_CONFIG="target/linux/x86/config-5.10"
          echo "CONFIG_MEDIA_SUPPORT=y" >> $KERNEL_CONFIG
          echo "CONFIG_MEDIA_DIGITAL_TV_SUPPORT=y" >> $KERNEL_CONFIG
          echo "CONFIG_DVB_CORE=y" >> $KERNEL_CONFIG
          echo "CONFIG_I2C=y" >> $KERNEL_CONFIG
          echo "CONFIG_I2C_DEVICE=y" >> $KERNEL_CONFIG

      - name: Configure firmware
        run: |
          cd openwrt
          make defconfig
          scripts/config --set-val CONFIG_TARGET_x86 y
          scripts/config --set-val CONFIG_TARGET_x86_64 y
          scripts/config --set-val CONFIG_TARGET_x86_64_GENERIC y
          scripts/config --set-str CONFIG_TARGET_ROOTFS_PARTSIZE 1024
          scripts/config --enable CONFIG_PACKAGE_kmod-tbs-driver
          scripts/config --enable CONFIG_PACKAGE_kmod-e1000e
          scripts/config --enable CONFIG_PACKAGE_kmod-igb
          scripts/config --enable CONFIG_PACKAGE_kmod-r8169
          scripts/config --enable CONFIG_PACKAGE_luci
          scripts/config --enable CONFIG_PACKAGE_luci-base
          make defconfig

      - name: Download package sources
        run: |
          cd openwrt
          make download -j$(nproc)

      - name: Build firmware
        run: |
          cd openwrt
          make -j$(nproc) V=s

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-22.03-tbs-driver
          path: |
            openwrt/bin/targets/x86/64/*.img
            openwrt/bin/targets/x86/64/*.img.gz
            openwrt/bin/packages/x86_64/base/kmod-tbs-driver*.ipk
