name: OpenWrt TBS DVB Driver CI
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Download OpenWrt 22.03.5 x86_64 SDK
        run: |
          wget -O openwrt-sdk.tar.xz https://downloads.openwrt.org/releases/22.03.5/targets/x86/64/openwrt-sdk-22.03.5-x86-64_gcc-11.2.0_musl.Linux-x86_64.tar.xz
          tar -xf openwrt-sdk.tar.xz
          mv openwrt-sdk-* openwrt-sdk

      - name: Checkout full repo
        uses: actions/checkout@v4
        with:
          path: openwrt-sdk/package/openwrt-dvb

      - name: Debug: Verify package path
        working-directory: openwrt-sdk
        run: |
          ls -la package/openwrt-dvb/
          ls -la package/openwrt-dvb/V4L-DVB/

      - name: Init feeds & register packages
        working-directory: openwrt-sdk
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig

      - name: Compile driver (only TBS, no Oscam for now)
        working-directory: openwrt-sdk
        run: |
          make -C package/openwrt-dvb/V4L-DVB clean compile install V=s

      - name: Upload IPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tbs-dvb-ipk
          path: openwrt-sdk/bin/packages/x86_64/base/*.ipk
          retention-days: 30
