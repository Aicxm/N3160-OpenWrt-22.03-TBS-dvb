name: OpenWrt DVB + Oscam CI
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Download OpenWrt 22.03.5 x86_64 SDK
        run: |
          wget -O openwrt-sdk.tar.xz https://downloads.openwrt.org/releases/22.03.5/targets/x86/64/openwrt-sdk-22.03.5-x86-64_gcc-11.2.0_musl.Linux-x86_64.tar.xz
          tar -xf openwrt-sdk.tar.xz
          mv openwrt-sdk-* openwrt-sdk

      - name: Checkout full repo
        uses: actions/checkout@v4
        with:
          path: openwrt-sdk/package/openwrt-dvb

      - name: Init feeds & config
        working-directory: openwrt-sdk
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig

      # 关键：使用正确的包路径 V4L-DVB，同时添加 Oscam 编译
      - name: Clean & Compile
        working-directory: openwrt-sdk
        run: |
          # 编译 TBS 驱动（V4L-DVB）
          make -C package/openwrt-dvb/V4L-DVB clean compile install V=s
          # 编译 Oscam（可选）
          make -C package/openwrt-dvb/奥斯卡姆 clean compile install V=s

      - name: Upload IPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dvb-oscam-ipk
          path: openwrt-sdk/bin/packages/x86_64/base/*.ipk
          retention-days: 30
